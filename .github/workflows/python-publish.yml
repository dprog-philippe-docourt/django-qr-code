# Builds the package and publishes it to PyPI when a GitHub release is published.
#
# Publishing uses PyPI Trusted Publishing (OpenID Connect), so no PyPI API token is stored in the repository. The PyPI
# project must declare this repository, this workflow file and the "pypi" environment as a trusted publisher, see
# https://docs.pypi.org/trusted-publishers/.
#
# Running the workflow manually builds and checks the package without publishing it.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.x'
    - name: Install build tools
      run: python -m pip install --upgrade build twine
    - name: Build package
      run: python -m build
    - name: Check package
      run: python -m twine check --strict dist/*
    - name: Check that the release tag matches the package version
      if: github.event_name == 'release'
      run: |
        version=$(python -c "import qr_code; print(qr_code.__version__)")
        if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
          echo "::error::The release tag (${GITHUB_REF_NAME}) does not match the package version (${version})."
          exit 1
        fi
    - name: Store the package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish:
    name: Publish the package to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-qr-code/
    permissions:
      id-token: write  # Required by PyPI Trusted Publishing.

    steps:
    - name: Retrieve the package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
