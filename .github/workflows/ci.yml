name: Django QR Code Build and Test

on:
  push:
    branches:
    - master
    - features/**
    - dependabot/**
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  docker:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Run tests
      run: |
        cd scripts
        ./run-tests.sh
      
