[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-qr-code"
dynamic = ["version"]
description = "An application that provides tools for displaying QR codes on your Django site."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Philippe Docourt", email = "philippe@docourt.ch" }]
maintainers = [{ name = "Philippe Docourt" }]
keywords = ["qr code", "django"]
dependencies = ["segno>=1.6", "django>=5.2", "pydantic>=2.7"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Natural Language :: English",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dprog-philippe-docourt/django-qr-code"
Documentation = "https://django-qr-code.readthedocs.io/"
Changelog = "https://github.com/dprog-philippe-docourt/django-qr-code/blob/master/CHANGELOG.md"
Issues = "https://github.com/dprog-philippe-docourt/django-qr-code/issues"

[tool.setuptools.dynamic]
version = { attr = "qr_code.__version__" }

[tool.setuptools.packages.find]
include = ["qr_code", "qr_code.*"]
exclude = ["qr_code.tests*"]
